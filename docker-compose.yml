services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rahul@123
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
  
  api:
    build: ./server/src
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:rahul%40123@db:5432/demo

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.angular
    ports:
      - "4200:4200"
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
