services:
  - type: web
    name: expense-tracker-api
    runtime: node
    buildCommand: npm install
    startCommand: node server/src/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: expt-277
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist/my-angular22-app/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
